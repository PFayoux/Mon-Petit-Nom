name: Deploy release to Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release à déployer'
        required: true
        default: 'latest'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        run: |
          if [ "${{ github.event.inputs.tag }}" = "latest" ]; then
            URL="https://github.com/${{ github.repository }}/releases/latest/download/web-build.zip"
          else
            URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag }}/web-build.zip"
          fi
          curl -L -o web-build.zip "$URL"
          mkdir site
          unzip web-build.zip -d site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
